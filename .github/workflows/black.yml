name: black

on:
  push:
    paths:
      - '**.py'
  # No path filter here: a required check skipped by path filtering stays pending and blocks merging.
  pull_request:

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Check formatting with black
      uses: psf/black@stable
      with:
        src: "inference tests"
