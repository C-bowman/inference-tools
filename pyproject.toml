[build-system]
requires = [
    "setuptools >= 80",
    "setuptools-scm >= 9.2",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inference*"]

[tool.setuptools_scm]
version_file = "inference/_version.py"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --first-parent"


[project]
name = "inference-tools"
dynamic = ["version"]
authors = [
    {name = "Chris Bowman", email = "chris.bowman.physics@gmail.com"},
]
description = "A collection of python tools for Bayesian data analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.26.4",
    "scipy >= 1.12",
    "matplotlib >= 3.4.2",
]

[project.urls]
Homepage = "https://github.com/C-bowman/inference-tools"
Documentation = "https://inference-tools.readthedocs.io/en/stable/"

[dependency-groups]
tests = [
    "pytest >= 3.3.0",
    "pytest-cov >= 3.0.0",
    "pyqt5 >= 5.15",
    "hypothesis >= 6.24",
    "freezegun >= 1.1.0",
]
